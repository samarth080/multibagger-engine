name: deterministic-static-build
on:
  schedule:
    - cron: "30 2 * * 1"   # Mondays 02:30 UTC = 08:00 IST, before market open
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: weekly-picks
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Render frozen site (network-denied in process)
        run: uv run python scripts/build_site.py
      - name: Verify deterministic rebuild
        run: uv run python scripts/verify_deterministic_build.py
      - name: Verify release contract
        run: uv run python scripts/verify_release.py --fixture tests/fixtures/phase8-public-value-hashes.json
      - name: Commit site (triggers Vercel deploy)
        run: |
          git config user.name "mbe-weekly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/
          git diff --cached --quiet && echo "no site changes" && exit 0
          git commit -m "chore(publish): weekly site build $(date -u +%F)"
          git push
