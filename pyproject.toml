[project]
name = "multibagger-engine"
version = "0.1.0"
description = "Autonomous equity research & multibagger discovery engine (India-first)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.50",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "pyarrow>=16.0",
    "duckdb>=1.5.4",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "scipy>=1.18.0",
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
    "markdown>=3.10.2",
    "lxml>=6.1.1",
    "defusedxml>=0.7.1",
]

[project.scripts]
mbe = "mbe.cli:app"
mbe-api = "mbe.api.app:run"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network' -q"
markers = [
    "network: tests that require internet access (deselected by default)",
]
